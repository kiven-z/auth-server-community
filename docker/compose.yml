name: auth-app

# 运行时定义（本地 / 服务器同一份）。不含 build，可单独拷到任意目录启动。
#
# 变量：
#   IMAGE_PREFIX              镜像仓库前缀，例：registry.cn-hangzhou.aliyuncs.com/kiven-z-auth（默认 auth，本地构建）
#   IMAGE_TAG                 例：community-latest、community-<sha> 或 local（本地构建，默认 local）
#   SPRING_PROFILES_ACTIVE    Spring / Nacos 命名空间 profile（默认 dev；生产写 prod）
#
# 远程部署：本文件 + docker/.env；先 docker login 再：
#   export IMAGE_PREFIX=registry.cn-hangzhou.aliyuncs.com/kiven-z-auth
#   export IMAGE_TAG=community-latest
#   export SPRING_PROFILES_ACTIVE=prod
# 宿主机需准备：/opt/ipdb/ip2region_v4.xdb、ip2region_v6.xdb（与 Nacos auth.common.ip-tool 路径一致）

services:
  service-auth:
    image: ${IMAGE_PREFIX:-auth}/service-auth:${IMAGE_TAG:-local}
    container_name: service-auth
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SPRING_CLOUD_NACOS_SERVER_ADDR: nacos:8848
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70.0 -XX:InitialRAMPercentage=40.0 -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError -Djava.security.egd=file:/dev/urandom -Duser.timezone=UTC"
    mem_limit: 1536m
    mem_reservation: 384m
    volumes:
      - /opt/ipdb:/opt/ipdb:ro
    ports:
      - "20001:20001"
    restart: unless-stopped
    networks:
      - auth-network

  service-system:
    image: ${IMAGE_PREFIX:-auth}/service-system:${IMAGE_TAG:-local}
    container_name: service-system
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SPRING_CLOUD_NACOS_SERVER_ADDR: nacos:8848
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70.0 -XX:InitialRAMPercentage=40.0 -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError -Djava.security.egd=file:/dev/urandom -Duser.timezone=UTC"
    mem_limit: 1536m
    mem_reservation: 384m
    volumes:
      - /opt/ipdb:/opt/ipdb:ro
    ports:
      - "20002:20002"
    restart: unless-stopped
    networks:
      - auth-network

  auth-gateway:
    image: ${IMAGE_PREFIX:-auth}/auth-gateway:${IMAGE_TAG:-local}
    container_name: auth-gateway
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SPRING_CLOUD_NACOS_SERVER_ADDR: nacos:8848
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70.0 -XX:InitialRAMPercentage=40.0 -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError -Djava.security.egd=file:/dev/urandom -Duser.timezone=UTC"
    mem_limit: 1536m
    mem_reservation: 384m
    volumes:
      - /opt/ipdb:/opt/ipdb:ro
    ports:
      - "8080:8080"
    restart: unless-stopped
    networks:
      - auth-network

networks:
  auth-network:
    external: true
