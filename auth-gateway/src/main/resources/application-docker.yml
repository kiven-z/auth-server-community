server:
  port: 8080

spring:
  cloud:
    nacos:
      server-addr: nacos:8848
      discovery:
        namespace: ${NACOS_NAMESPACE:docker}
      config:
        namespace: ${NACOS_NAMESPACE:docker}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: info
    com.auth: info
